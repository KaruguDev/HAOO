# SonarQube analysis configuration.
#
# Connection details are deliberately absent: sonar.host.url and the analysis token are
# supplied by the environment (SONAR_HOST_URL / SONAR_TOKEN) so no credential and no
# machine-specific address is committed. Run with:
#   npm run coverage && sonar-scanner
#
# This path is a RATIFIED SHARED SCAFFOLD ENTRY (Ground A, added 2026-09-16). The same
# file exists in KaruguDev/ZERO-PAPERHUB, because both repositories are scanned by the
# same analyser; the two copies name their own project key and their own tree and are NOT
# required to be byte-identical. See `shared-scaffold.txt`.
sonar.projectKey=haoo
sonar.projectName=HAOO
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=src,scripts
sonar.tests=src/test,e2e

# src/test is inside src, so it must be excluded from sources or the scanner indexes it
# twice and fails. The rest are generated or are not source: the build output and the two
# bundle probes, the Playwright run scratch, the coverage report, and the agent worktrees
# under .claude/ and .gsd/, which hold whole duplicate copies of this source tree.
# `evidence/` is committed and is the phase's measured product, not code to analyse.
sonar.exclusions=src/test/**,e2e/**,node_modules/**,dist/**,dist-approved-host-probe/**,dist-provider-unset-probe/**,coverage/**,evidence/**,.playwright-report/**,.playwright-results/**,.claude/**,.gsd/**,.reports/**,.planning/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ─── ACCEPTED FINDINGS, SCOPED AND REASONED ──────────────────────────────────────────
# Each rule below does not apply to the code it fires on. They are recorded here rather
# than resolved in the SonarQube UI so the reasoning lives in the repository, is reviewed
# like any other change, and survives a server rebuild. Scoped to a path, never global.
sonar.issue.ignore.multicriteria=e2eConditionalSkip,e2eFixedWait,searchParamsSpread

# S1607 "remove this unit test or explain why it is ignored" across the Playwright specs.
# Every hit is a CONDITIONAL skip — `test.skip(testInfo.project.name !== 'live', '<reason>')`
# inside a `requireLive` / `requireProject` guard — which targets a spec at the project that
# can actually measure it, and already carries a written reason in the call. These are not
# disabled tests. Acting on the rule would drive induced form-failure states into the live
# provider (e2e/form-states.e2e.ts) or write preview records indistinguishable from live
# ones (e2e/semantics.e2e.ts), which those guards exist to prevent.
sonar.issue.ignore.multicriteria.e2eConditionalSkip.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.e2eConditionalSkip.resourceKey=e2e/**/*

# S2925 "replace this fixed wait with a synchronization on an observable condition" across
# the same specs. Twelve of the fourteen sit in live-only specs that cannot be verified
# without driving www.haoo.online. The two reachable from the preview project are ABSENCE
# assertions — that no SECOND request was issued inside a window, and that nothing moved
# once the shipped 200 ms transition would have finished. A fixed wait is the correct
# instrument for "nothing happened during this interval": there is no observable condition
# for an event that must not occur. ACCEPTED SCOPE: this also silences a genuine race if
# one is introduced under e2e/, which is the price of the rule not fitting the directory.
sonar.issue.ignore.multicriteria.e2eFixedWait.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.e2eFixedWait.resourceKey=e2e/**/*

# S7747 "`for…of` can iterate over iterable, it's unnecessary to convert to an array" at
# src/measurement/index.ts. The spread is load-bearing: the loop DELETES from
# `url.searchParams` while iterating it, so the copy is what keeps the iterator valid.
# Applying the rule would mutate a collection under its own iterator.
sonar.issue.ignore.multicriteria.searchParamsSpread.ruleKey=typescript:S7747
sonar.issue.ignore.multicriteria.searchParamsSpread.resourceKey=src/measurement/index.ts
