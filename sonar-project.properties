# SonarQube analysis configuration.
#
# Connection details are deliberately absent: sonar.host.url and the analysis token are
# supplied by the environment (SONAR_HOST_URL / SONAR_TOKEN) so no credential and no
# machine-specific address is committed. Run with:
#   npm run coverage && sonar-scanner
#
# This path is a RATIFIED SHARED SCAFFOLD ENTRY (Ground A, added 2026-09-16). The same
# file exists in KaruguDev/ZERO-PAPERHUB, because both repositories are scanned by the
# same analyser; the two copies name their own project key and their own tree and are NOT
# required to be byte-identical. See `shared-scaffold.txt`.
sonar.projectKey=haoo
sonar.projectName=HAOO
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=src,scripts
sonar.tests=src/test,e2e

# src/test is inside src, so it must be excluded from sources or the scanner indexes it
# twice and fails. The rest are generated or are not source: the build output and the two
# bundle probes, the Playwright run scratch, the coverage report, and the agent worktrees
# under .claude/ and .gsd/, which hold whole duplicate copies of this source tree.
# `evidence/` is committed and is the phase's measured product, not code to analyse.
sonar.exclusions=src/test/**,e2e/**,node_modules/**,dist/**,dist-approved-host-probe/**,dist-provider-unset-probe/**,coverage/**,evidence/**,.playwright-report/**,.playwright-results/**,.claude/**,.gsd/**,.reports/**,.planning/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
